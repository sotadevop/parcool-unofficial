plugins {
	id 'architectury-plugin'
	id 'dev.architectury.loom-no-remap'
}

// architectury-plugin registers :common's `transformProduction*` tasks while evaluating :common, and
// both loader modules reference them below, so :common has to be evaluated first.
evaluationDependsOn(':common')

// Gradle leaves an undeclared project version at "unspecified", and processResources expands
// ${version} into fabric.mod.json from it - so the shipped mod metadata said `"version": "unspecified"`
// and Fabric Loader warned on every launch:
//   Mod parcool uses the version unspecified which isn't compatible with Loader's extended semantic
//   version format
// :common sets the same value; mirror it so the loader metadata, the jar manifest and the module all
// agree with gradle.properties.
version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	// The access widener lives in :common resources; Loom needs a concrete file to apply it.
	accessWidenerPath = project(':common').file('src/main/resources/parcool.accesswidener')

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// A second client with its own game directory and a fixed name, so two ParCool players can be
		// on one server at the same time - that is what exercises the action-state broadcast path
		// (ActionStateBroadcastPayload / ActionStatePayload) between two real players.
		client2 {
			client()
			runDir = project.file('run-client2')
			programArgs '--username', project.findProperty('parcoolUsername2') ?: 'ParCoolTester2'
		}
	}
}

// The access widener and the mixin config live in :common so both loaders ship the same copy; the
// Fabric module only needs them present in its own jar, because fabric.mod.json references them.
processResources {
	// Ship the LGPL text inside the jar.
	from(rootProject.file('LICENSE'))
}

tasks.named('processResources') {
	def props = [
			version            : project.version,
			mod_id             : project.mod_id,
			mod_name           : project.mod_name,
			mod_license        : project.mod_license,
			mod_authors        : project.mod_authors,
			minecraft_version  : project.minecraft_version,
	]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

// mixin.debug makes the dev log list every applied ParCool mixin.
['runClient', 'runClient2', 'runServer'].each { runTask ->
	tasks.named(runTask) {
		it.jvmArgs '-Dmixin.debug=true', '-Dmixin.debug.verbose=true'
		// `-PparcoolMixinAudit` makes the run load every mixin target and exit (see MixinAudit).
		if (project.hasProperty('parcoolMixinAudit')) {
			it.jvmArgs '-Dparcool.mixinAudit=true'
		}
		// `./gradlew :fabric:runClient -PparcoolQuickPlay=host:port` boots straight into a server, and
		// `-PparcoolQuickPlayWorld=<name>` into a saved world; both are how a cross-loader join
		// and the in-world render pass are reproduced without a mouse.
		if (runTask.startsWith('runClient') && project.hasProperty('parcoolQuickPlay')) {
			it.args '--quickPlayMultiplayer', project.property('parcoolQuickPlay').toString()
		}
		if (runTask == 'runClient' && project.hasProperty('parcoolQuickPlayWorld')) {
			it.args '--quickPlaySingleplayer', project.property('parcoolQuickPlayWorld').toString()
		}
	}
}

// The common resource root is added to this module too, so a dev run sees ParCool's assets as
// mod resources.
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

// :common is compiled against and run with, but not published as its own dependency: its classes
// are merged into the distributable jar below.
configurations {
	common
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

repositories {
	// Mod Menu is only compiled against (for its API interfaces); players who have it installed
	// get ParCool's "Configure" button, everyone else is unaffected.
	exclusiveContent {
		forRepository {
			maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"
	common(project(path: ':common')) { transitive false }
	compileOnly("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }

	// Upstream uses javax.annotation.Nullable/Nonnull throughout; Loom does not provide JSR-305.
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "com.google.code.gson:gson:2.10.1"
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/**
 * The distributable Fabric jar: this module's classes and metadata plus the :common code and assets.
 *
 * Since 26.1 Minecraft ships unobfuscated, so there is no remapping step any more: both jars already
 * contain the final bytecode and are simply merged. This module goes first, so its fabric.mod.json
 * and ServiceLoader file win over anything with the same path.
 */
tasks.register('distJar', Jar) {
	group = 'build'
	description = 'Assembles the distributable Fabric jar (common + fabric module).'

	archiveClassifier = 'fabric'
	dependsOn tasks.named('jar'), ':common:jar'

	from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) })
	from({ zipTree(project(':common').tasks.named('jar').get().archiveFile.get().asFile) })

	manifest {
		attributes(
				'Implementation-Title': project.mod_name,
				'Implementation-Version': project.mod_version,
				'Implementation-Vendor': project.mod_authors
		)
	}
}

tasks.named('assemble') {
	dependsOn 'distJar'
}
