// ParCool 4.0 for Fabric, Minecraft 26.3. One module; Minecraft is unobfuscated since 26.1, so
// Loom does no remapping and mod dependencies use the plain `implementation`/`compileOnly`.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = "${project.mod_id}-${project.minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    // Report every error in one CI round instead of stopping at javac's default of 100.
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

loom {
    accessWidenerPath = file('src/main/resources/parcool.accesswidener')
    mods {
        "${project.mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
    // Forge Config API Port, from its author's own maven.
    maven { name = 'Fuzs'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    exclusiveContent {
        forRepositories(maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' })
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forgeconfigapiport_version}"
    // javax.annotation (@Nullable, @Nonnull): NeoForge ships it, Fabric does not. Annotations only.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }
}

// 4.0 ships its JSON assets minified (buildSrc/MinifyJsonTask).
tasks.register('minifyJsonResource', MinifyJsonTask) {
    inputDir = file('src/template/resources-minified')
    outputDir = layout.buildDirectory.dir('generated/resources-minified-json')
}
sourceSets.main.resources.srcDir tasks.named('minifyJsonResource')

processResources {
    def props = [
            version          : project.version,
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            mod_license      : project.mod_license,
            mod_authors      : project.mod_authors,
            minecraft_version: project.minecraft_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
    // Ship the LGPL text inside the jar.
    from('LICENSE')
}

// `-PparcoolMixinAudit` makes a run load every mixin target and exit (see MixinAudit); CI uses it.
['runClient', 'runServer'].each { runTask ->
    tasks.named(runTask) {
        it.jvmArgs '-Dmixin.debug.verbose=true'
        if (project.hasProperty('parcoolMixinAudit')) it.jvmArgs '-Dparcool.mixinAudit=true'
    }
}
