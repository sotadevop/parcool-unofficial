# Builds the mod on every push and keeps the Fabric jar as a downloadable artifact.
# It never publishes anything: no tokens or secrets are used.
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned instead of ubuntu-latest so the build environment only changes when we choose to.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          # A fresh checkout must build :common first: the loader modules read its jar while
          # Gradle configures them (documented in BUILDING.md).
          ./gradlew :common:build --stacktrace 2>&1 | tee build.log
          ./gradlew build --stacktrace 2>&1 | tee -a build.log

      # On failure, repeat the important parts of the log as annotations, so they can be read
      # through the GitHub API without downloading the full log.
      - name: Report build errors
        if: failure()
        run: |
          {
            sed -n '/What went wrong/,/^\* Try/p' build.log
            grep -E 'error:|warning: \[removal\]|Exception|Caused by' build.log
          } | head -400 > report.txt
          split -l 50 report.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build log ${f#part_}::${msg}"
          done

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: parcool-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error
