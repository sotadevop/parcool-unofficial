org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=26.3
loader_version=0.20.0
fabric_api_version=0.163.0+26.3

# Architectury
# 22.x is the Architectury API line for Minecraft 26.3.
architectury_api_version=22.0.5

# Mod Menu, compile-only (config screen integration)
modmenu_version=21.0.0

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
